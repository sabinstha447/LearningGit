name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TaskBoard
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NEt
        uses: actions/setup-dotnet@v4
        with: 
          dotnet-version: '8.0.x'
      - name: Restore Dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
